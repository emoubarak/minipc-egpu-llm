<svg xmlns="http://www.w3.org/2000/svg" width="888" height="574" viewBox="0 0 888 574" role="img" aria-label="Throughput of llama.cpp on a Ryzen 7 8845HS mini PC with an RTX 3060 Ti over OCuLink and a Radeon 780M iGPU">
